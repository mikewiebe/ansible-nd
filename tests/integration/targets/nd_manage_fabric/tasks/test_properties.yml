---
# Property validation tests for nd_manage_fabric module
# Tests fabric property constraints and validation

- name: Test Properties 1 - Validate required properties
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-prop-required"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "65700"
          anycast_gateway_mac: "2020.0000.0700"
          replication_mode: ingress
  register: properties_test1_result

- name: Verify Properties Test 1 - Required properties
  assert:
    that:
      - properties_test1_result is changed
      - properties_test1_result.response is defined
    fail_msg: "Required properties validation failed"
    success_msg: "Required properties validated successfully"

- name: Test Properties 2 - Validate BGP ASN range
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-prop-bgp-asn"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "4294967295"  # Maximum valid ASN
          anycast_gateway_mac: "2020.0000.0701"
          replication_mode: multicast
  register: properties_test2_result

- name: Verify Properties Test 2 - BGP ASN validation
  assert:
    that:
      - properties_test2_result is changed
      - properties_test2_result.response is defined
    fail_msg: "BGP ASN validation failed"
    success_msg: "BGP ASN validated successfully"

