    success_msg: "VPC settings validated successfully"

- name: Test Properties 10 - Validate AI/ML specific properties
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-prop-aiml"
        category: fabric
        security_domain: all
        management:
          type: aimlVxlanEbgp
          bgp_asn: "65709"
          anycast_gateway_mac: "2020.0000.0709"
          replication_mode: multicast
          aiml_qos: true
          aiml_qos_policy: 400G
  register: properties_test10_result

- name: Verify Properties Test 10 - AI/ML properties validation
  assert:
    that:
      - properties_test10_result is changed
      - properties_test10_result.response is defined
    fail_msg: "AI/ML properties validation failed"
    success_msg: "AI/ML properties validated successfully"

- name: Test Properties 11 - Validate boolean properties
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-prop-booleans"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "65710"
          anycast_gateway_mac: "2020.0000.0710"
          replication_mode: ingress
          bfd: true
          bfd_ibgp: true
          bfd_pim: false
          bfd_isis: true
          bfd_ospf: false
          security_group_tag: true
          macsec: false
          performance_monitoring: true
          real_time_interface_statistics_collection: false
          strict_config_compliance_mode: true
  register: properties_test11_result

- name: Verify Properties Test 11 - Boolean properties validation
  assert:
    that:
      - properties_test11_result is changed
      - properties_test11_result.response is defined
    fail_msg: "Boolean properties validation failed"
    success_msg: "Boolean properties validated successfully"

- name: Test Properties 12 - Validate combination constraints
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-prop-constraints"
        category: fabric
        security_domain: all
        management:
          type: aimlVxlanEbgp
          bgp_asn: "65711"
          anycast_gateway_mac: "2020.0000.0711"
          replication_mode: multicast
          # AI/ML with required properties
          aiml_qos: true
          aiml_qos_policy: 100G
          fabric_interface_type: p2p
          link_state_routing_protocol: ospf
          ospf_area_id: "0.0.0.1"
  register: properties_test12_result

- name: Verify Properties Test 12 - Combination constraints validation
  assert:
    that:
      - properties_test12_result is changed
      - properties_test12_result.response is defined
    fail_msg: "Combination constraints validation failed"
    success_msg: "Combination constraints validated successfully"

- name: Clean up property test fabrics
  cisco.nd.nd_manage_fabric:
    state: deleted
    config:
      - name: "{{ test_fabric_prefix }}-prop-required"
      - name: "{{ test_fabric_prefix }}-prop-bgp-asn"
      - name: "{{ test_fabric_prefix }}-prop-mac"
      - name: "{{ test_fabric_prefix }}-prop-mtu"
      - name: "{{ test_fabric_prefix }}-prop-vni"
      - name: "{{ test_fabric_prefix }}-prop-vlan"
      - name: "{{ test_fabric_prefix }}-prop-ospf"
      - name: "{{ test_fabric_prefix }}-prop-location"
      - name: "{{ test_fabric_prefix }}-prop-vpc"
      - name: "{{ test_fabric_prefix }}-prop-aiml"
      - name: "{{ test_fabric_prefix }}-prop-booleans"
      - name: "{{ test_fabric_prefix }}-prop-constraints"
  register: properties_cleanup_result
  ignore_errors: true

- name: Display property validation test results
  debug:
    msg:
      - "Property validation tests completed"
      - "All property constraints and validations tested successfully"
      - "Required properties, ranges, formats, and combinations verified"
      - "Cleanup completed: {{ properties_cleanup_result.changed | default(false) }}"
