---
# Edge case tests for nd_manage_fabric module
# Tests boundary conditions and unusual scenarios

- name: Test Edge Case 1 - Minimum valid BGP ASN
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-edge-min-asn"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "1"  # Minimum valid ASN
          anycast_gateway_mac: "2020.0000.1000"
          replication_mode: ingress
  register: edge_test1_result

- name: Verify Edge Case Test 1 - Minimum BGP ASN
  assert:
    that:
      - edge_test1_result is changed
      - edge_test1_result.response is defined
    fail_msg: "Minimum BGP ASN edge case failed"
    success_msg: "Minimum BGP ASN edge case passed"

- name: Test Edge Case 2 - Maximum valid BGP ASN
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-edge-max-asn"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "4294967295"  # Maximum valid 32-bit ASN
          anycast_gateway_mac: "2020.0000.1001"
          replication_mode: multicast
  register: edge_test2_result

- name: Verify Edge Case Test 2 - Maximum BGP ASN
  assert:
