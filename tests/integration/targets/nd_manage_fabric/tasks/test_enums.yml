- name: Test Enums 1 - BgpAuthenticationKeyType enum values
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-enum-bgp-auth-3des"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "65900"
          anycast_gateway_mac: "2020.0000.0900"
          replication_mode: ingress
          bgp_authentication_key_type: 3des
  register: enum_test1_result

- name: Verify Enums Test 1 - 3des authentication
  assert:
    that:
      - enum_test1_result is changed
      - enum_test1_result.response is defined
    fail_msg: "3des BGP authentication enum failed"
    success_msg: "3des BGP authentication enum validated"

