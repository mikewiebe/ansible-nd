---
# Error validation tests for nd_manage_fabric module
# Tests error handling and input validation

- name: Test Validation 1 - Missing required name parameter
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "65800"
          anycast_gateway_mac: "2020.0000.0800"
          replication_mode: ingress
  register: validation_test1_result
  ignore_errors: true

- name: Verify Validation Test 1 - Missing name error
  assert:
    that:
      - validation_test1_result is failed
    fail_msg: "Missing name parameter should cause validation error"
    success_msg: "Missing name parameter properly validated"

- name: Test Validation 2 - Invalid BGP ASN (out of range)
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-invalid-asn"
        category: fabric
        security_domain: all
        management:
          type: vxlanEbgp
          bgp_asn: "4294967296"  # Exceeds maximum 32-bit ASN
          anycast_gateway_mac: "2020.0000.0801"
          replication_mode: ingress
  register: validation_test2_result
  ignore_errors: true

- name: Verify Validation Test 2 - Invalid BGP ASN error
  assert:
    that:
      - validation_test2_result is failed
    fail_msg: "Invalid BGP ASN should cause validation error"
    success_msg: "Invalid BGP ASN properly validated"

