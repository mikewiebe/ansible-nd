- name: Test Validation 13 - Conflicting AI/ML settings
  cisco.nd.nd_manage_fabric:
    state: merged
    config:
      - name: "{{ test_fabric_prefix }}-aiml-conflict"
        category: fabric
        security_domain: all
        management:
          type: classicLan  # Not AI/ML fabric type
          bgp_asn: "65812"
          anycast_gateway_mac: "2020.0000.0812"
          replication_mode: multicast
          aiml_qos: true    # AI/ML setting on non-AI/ML fabric
          aiml_qos_policy: 25G
  register: validation_test13_result
  ignore_errors: true

- name: Verify Validation Test 13 - AI/ML conflict error
  assert:
    that:
      - validation_test13_result is failed
    fail_msg: "AI/ML settings on non-AI/ML fabric should cause validation error"
    success_msg: "AI/ML settings conflict properly validated"

